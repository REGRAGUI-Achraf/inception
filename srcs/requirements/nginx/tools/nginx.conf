server {
    # [x] listen 443 ssl
    listen 443 ssl;
    server_name aregragu.42.fr;

    # [x] ssl_protocols TLSv1.2 TLSv1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/inception.crt;
    ssl_certificate_key /etc/nginx/inception.key;

    # [x] Point root to /var/www/html
    root /var/www/html;
    index index.php index.html;

    # [x] Handle .php files correctly
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # [x] fastcgi_pass to wordpress:9000
        fastcgi_pass wordpress:9000;
    }
}