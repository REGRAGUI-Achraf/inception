#version: '3'

services:
  mariadb:
    build: requirements/mariadb
    restart: always
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: requirements/wordpress
    restart: always
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - db_password
      - credentials
      - db_root_password

  nginx:
    build: requirements/nginx
    restart: always
    env_file:
      - .env
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html

  redis:
    build: requirements/bonus/redis
    restart: always
    networks:
      - inception

  ftp:
    build: requirements/bonus/ftp
    restart: always
    env_file:
      - .env
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21110:21100-21110"

  adminer:
    build: requirements/bonus/adminer
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception
  static-site:
      build: requirements/bonus/static-site
      restart: always
      networks:
        - inception
      ports:
        - "8080:8080"      
  netdata:
    build: requirements/bonus/netdata
    restart: always
    networks:
      - inception
    ports:
      - "19999:19999"
networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/user/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/user/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

